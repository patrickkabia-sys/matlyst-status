name: Mål Supabase

# ⚠️ Trigges KUN på schedule og manuell kjøring. Aldri på pull_request.
#
# Repoet er offentlig, og det er nettopp fork-baserte pull requests som er
# angrepsveien mot hemmeligheter i offentlige repoer: en fork endrer workflowen
# til å skrive dem ut. GitHub sender aldri secrets til fork-PR-er, og her finnes
# triggeren ikke i det hele tatt. workflow_dispatch krever skrivetilgang.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Én kjøring om gangen. To samtidige ville kunne skrive over hverandres
# status.json og gi en push-konflikt.
concurrency:
  group: maal
  cancel-in-progress: false

jobs:
  maal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Testene kjører FØR målingen. En ødelagt fletting skal aldri få lov til
      # å skrive status.json, for da lyver statusen i stedet for å mangle.
      - name: Kjør testene
        run: node test-maal.mjs

      # Tilstanden FØR målingen, lest fra fila på disk. Trengs for å vite om
      # dette er et skifte eller bare enda en måling som sier det samme.
      - name: Hva sto det før
        run: |
          echo "FORRIGE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('status.json','utf8')).tilstand)")" >> "$GITHUB_ENV"

      - name: Mål og skriv status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node maal.mjs

      - name: Commit hvis noe endret seg
        run: |
          if git diff --quiet status.json; then
            echo "uendret, ingenting å committe"
            exit 0
          fi
          TILSTAND=$(node -e "console.log(JSON.parse(require('fs').readFileSync('status.json','utf8')).tilstand)")
          git config user.name "matlyst-status"
          git config user.email "hei@matlyst-app.no"
          git add status.json
          git commit -m "status: $TILSTAND"
          git push
          echo "NY=$TILSTAND" >> "$GITHUB_ENV"

      # ⚠️ Et varsel KUN ved skifte, aldri ved hver måling. Grunnen er den samme
      # som at `nede` krever at alle tre probene feiler: et varsel som kommer
      # hvert femte minutt blir slått av, og da varsler det ingenting.
      #
      # Dette finnes fordi sida meldte falsk nedetid i 30 timer 28.08.2026 uten
      # at noen fikk beskjed. Den ble oppdaget ved at et menneske tilfeldigvis
      # så etter. Kostnaden var ikke feilen, den var de 30 timene.
      #
      # Emnet er den eneste tilgangskontrollen ntfy har, derfor secret og ikke
      # variable, og derfor har denne workflowen ingen pull_request-trigger.
      - name: Varsle ved skifte
        if: env.NY != '' && env.NY != env.FORRIGE
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC mangler, hopper over"; exit 0; fi
          case "$NY" in
            nede) TITTEL="Matlyst: serveren svarer ikke"; PRI=5 ;;
            treg) TITTEL="Matlyst: serveren er treg";     PRI=4 ;;
            oppe) TITTEL="Matlyst: serveren er tilbake";  PRI=3 ;;
            *)    TITTEL="Matlyst: status $NY";           PRI=3 ;;
          esac
          # Kroppen er UTF-8 og tar norske tegn. Tittelen er en HTTP-header og
          # holdes derfor til ren ASCII, ellers viser telefonen «Ã¦Ã¸Ã¥».
          curl -sS --max-time 20 \
            -H "Title: $TITTEL" -H "Priority: $PRI" \
            -d "Status gikk fra $FORRIGE til $NY. https://status.matlyst-app.no" \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          echo "varslet: $FORRIGE -> $NY"
